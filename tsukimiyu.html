<h1>쓰키미유 온천</h1>
<p>세타가야 · 천연 온천 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 세타가야구 아카쓰쓰미 5-36-16</p>
<p>세타가야에 자리한 천연 온천 &#x27;쓰키미유 온천&#x27;은(는) 이름 그대로 천연 온천이 특징인 센토입니다. 메타규산과 철분을 함유한 온천수를 그대로 흘려보내는 욕조가 있고, 30명 정도가 들어갈 수 있는 큰 욕조와 잘 식힌 냉수탕이 호평입니다. 하이퍼 제트와 전기탕, 사우나까지 설비가 알찹니다.</p>
