<h1>오쓰카유</h1>
<p>메구로 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 메구로구 나카초 1-8-11</p>
<p>메구로에 자리한 전통 센토 &#x27;오쓰카유&#x27;은(는) 유텐지역에서 도보 12분, 아부라멘 상점가 안에 자리한 동네 센토입니다. 외관은 맨션이지만 안은 정통 목욕탕으로, 지역 주민들이 일상적으로 찾는 곳입니다.</p>
