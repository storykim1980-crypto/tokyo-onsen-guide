<h1>다쓰미유 (기요스미시라카와)</h1>
<p>고토 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 고토구 미요시 1-2-3</p>
<p>고토에 자리한 전통 센토 &#x27;다쓰미유 (기요스미시라카와)&#x27;은(는) 기요스미 정원 인근의 5층 빌딩형 센토로, 노천탕과 전용 휴게실을 갖췄습니다. 손님이 두고 간 수건으로 만든 인형이 1000개 넘게 진열된 휴게 공간이 명물이며, 아이를 위한 배려도 세심합니다.</p>
