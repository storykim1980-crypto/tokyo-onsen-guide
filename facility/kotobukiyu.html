<h1>고토부키유</h1>
<p>다이토 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 다이토구 히가시우에노 5-4-17</p>
<p>다이토에 자리한 전통 센토 &#x27;고토부키유&#x27;은(는) 우에노 인근에서 노천탕과 사우나로 인기가 높은 센토입니다. 도심 센토로는 드물게 개방감 있는 노천 공간을 갖췄습니다.</p>
