<h1>스에히로유 (오이마치)</h1>
<p>시나가와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 시나가와구 오이 1-42-4</p>
<p>시나가와에 자리한 전통 센토 &#x27;스에히로유&#x27;은(는) 오이마치 지역의 센토로, 평일은 오후 3시부터 심야 1시까지, 주말은 오전 10시부터 문을 엽니다. 사우나를 갖춰 이용 시간대가 넓습니다. 다이토구 아키하바라의 스에히로노유와는 다른 시설입니다.</p>
