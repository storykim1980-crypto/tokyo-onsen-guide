<h1>쓰루노유 (기타코이와)</h1>
<p>에도가와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 에도가와구 기타코이와 7-19-13</p>
<p>에도가와에 자리한 전통 센토 &#x27;쓰루노유 (기타코이와)&#x27;은(는) 노천탕이 자랑인 동네 센토로, 여탕은 정자풍 노천탕, 남탕 노천탕에서는 굴뚝을 올려다볼 수 있습니다. 드라이어가 무료이며 게이세이코이와역에서 도보 5분 거리입니다. 후나보리의 동명 시설과는 다른 곳입니다.</p>
