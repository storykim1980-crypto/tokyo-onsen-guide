<h1>미나토유</h1>
<p>주오 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 주오구 미나토 1-6-2</p>
<p>주오에 자리한 전통 센토 &#x27;미나토유&#x27;은(는) 기타시나가와의 덴진유와 형제가 함께 운영하는 자매점으로, 2010년 개장을 거쳐 모던하고 쾌적한 공간으로 거듭났습니다. 핫초보리와 갓타치 인근의 오피스가에서 편히 들를 수 있는 센토입니다.</p>
