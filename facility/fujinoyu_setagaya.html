<h1>후지노유 (다마가와다이)</h1>
<p>세타가야 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 세타가야구 다마가와다이 2-8-9</p>
<p>세타가야에 자리한 전통 센토 &#x27;후지노유 (다마가와다이)&#x27;은(는) 천장이 높은 미야즈쿠리 건축의 센토입니다. 제트탕과 기포탕 외에 정자 아래 히노키 욕조(비장탄탕)가 있어 인기이며, 손질이 잘 된 나무의 온기가 느껴지는 공간입니다.</p>
