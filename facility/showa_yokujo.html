<h1>쇼와요쿠조</h1>
<p>나카노 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 나카노구 주오 3-19-2</p>
<p>나카노에 자리한 전통 센토 &#x27;쇼와요쿠조&#x27;은(는) 질 좋은 우물물을 장작으로 데워 쓰는 센토로, 뜨거운 목욕물이 자랑입니다. 잘 식힌 냉수탕과 강력한 제트탕도 호평이며, 욕실을 채우는 역동적인 타일 벽화가 인상적입니다.</p>
