<h1>다이니 후지미유</h1>
<p>이타바시 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 이타바시구 사이와이초 20-5</p>
<p>이타바시에 자리한 전통 센토 &#x27;다이니 후지미유&#x27;은(는) 저녁 4시부터 자정까지 영업하는 동네 센토입니다. 일요일과 공휴일에는 한 시간 이른 오후 3시부터 문을 엽니다.</p>
