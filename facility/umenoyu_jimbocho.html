<h1>우메노유 (진보초)</h1>
<p>치요다 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 지요다구 간다진보초 2-8-2</p>
<p>치요다에 자리한 전통 센토 &#x27;우메노유 (진보초)&#x27;은(는) 세계 최대 헌책방 거리로 유명한 진보초에 자리한 동네 센토입니다. 책방 순례 뒤에 들르기 좋은 위치입니다. 아다치구·오메시·아라카와구의 동명 센토와는 각각 다른 시설입니다.</p>
