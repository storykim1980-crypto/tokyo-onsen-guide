<h1>후지노유 (아다치)</h1>
<p>아다치 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 아다치구 도와 4-15-10</p>
<p>아다치에 자리한 전통 센토 &#x27;후지노유 (아다치)&#x27;은(는) 41도의 미지근한 목욕물이라 아이도 부담 없이 들어갈 수 있는 센토입니다. 물은 장작으로 데우며, 목욕 후 넓은 로비에서 쉴 수 있고 주차장도 다섯 대분 갖췄습니다. 기타구·가쓰시카구의 동명 센토와는 다른 시설입니다.</p>
