<h1>이나리유 (가미이케부쿠로)</h1>
<p>도시마 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 도시마구 가미이케부쿠로 1-9-17</p>
<p>도시마에 자리한 전통 센토 &#x27;이나리유 (가미이케부쿠로)&#x27;은(는) 탈의실과 욕실의 천장이 높아 개방감이 있는 센토입니다. 깊은 좌욕, 기포탕, 전기탕, 날마다 바뀌는 약탕, 파워 제트, 냉수탕을 갖췄고 잘 식힌 냉수탕이 호평입니다. 기타구의 동명 센토와는 다른 시설입니다.</p>
