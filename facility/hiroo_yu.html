<h1>히로오유</h1>
<p>시부야 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 시부야구 히로오 5-4-16</p>
<p>시부야에 자리한 전통 센토 &#x27;히로오유&#x27;은(는) 히로오에서 80여 년을 이어온 센토로, 역에서 도보 1분 거리입니다. 질 좋은 우물물을 뜨겁게 데워 쓰며 제트탕의 수압도 강합니다. 2017년 7월 리뉴얼 오픈했고, 인사와 청결에 힘쓰는 옛 정취의 목욕탕입니다.</p>
