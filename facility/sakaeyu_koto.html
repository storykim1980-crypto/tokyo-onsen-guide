<h1>아케보노유 (고토)</h1>
<p>고토 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 고토구 도요 4-6-3</p>
<p>고토에 자리한 전통 센토 &#x27;아케보노유&#x27;은(는) 도요초역 도보권의 동네 센토입니다. 예스러운 목욕탕의 분위기를 간직하고 있으며, 다이토구 아사쿠사의 동명 센토와는 다른 시설입니다.</p>
