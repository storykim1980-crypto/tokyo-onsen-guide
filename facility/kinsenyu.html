<h1>긴센유</h1>
<p>신주쿠 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 신주쿠구 니시와세다 2-16-20</p>
<p>신주쿠에 자리한 전통 센토 &#x27;긴센유&#x27;은(는) 잉어 다섯 마리가 헤엄치는 연못과 정원이 아름다운 센토입니다. 폭포가 흘러 목욕 후 정원을 바라보며 쉬기 좋고, 주마다 바뀌는 약탕도 운영합니다.</p>
