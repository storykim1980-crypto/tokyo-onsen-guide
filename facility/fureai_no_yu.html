<h1>후레아이노유</h1>

<p>도쿄도 미나토구 시바 2-2-18</p>
<p>미나토에 자리한 전통 센토 &#x27;후레아이노유&#x27;은(는) 시바코엔과 도쿄타워에서 멀지 않은 곳에 자리한 동네 센토입니다. 관광 일정 사이에 들르기 좋은 위치입니다.</p>
