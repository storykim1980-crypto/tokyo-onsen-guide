<h1>유~유랜드 아즈마</h1>
<p>도시마 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 도시마구 나가사키 1-4-9</p>
<p>도시마에 자리한 전통 센토 &#x27;유~유랜드 아즈마&#x27;은(는) 시이나마치역에서 도보 6분 거리의 동네 센토입니다. 욕조 종류가 풍부해 여유롭게 시간을 보낼 수 있습니다.</p>
