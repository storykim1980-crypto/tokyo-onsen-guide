<h1>데라시마요쿠조</h1>
<p>스미다 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 스미다구 히가시무코지마 6-34-18</p>
<p>스미다에 자리한 전통 센토 &#x27;데라시마요쿠조&#x27;은(는) 히가시무코지마역에서 도보 3분 거리의 센토입니다. 제트탕, 고온탕, 전기탕과 암반욕을 결합한 삼림욕탕, 냉수탕, 사우나를 갖췄고 24시간 코인 세탁실도 병설되어 있습니다. 날마다 바뀌는 약탕과 잘 식힌 냉수탕이 호평입니다.</p>
