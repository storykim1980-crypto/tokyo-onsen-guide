<h1>고스기유 하라주쿠</h1>
<p>시부야 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 시부야구 진구마에 6-31-21 하라카도 B1F</p>
<p>시부야에 자리한 전통 센토 &#x27;고스기유 하라주쿠&#x27;은(는) 고엔지의 노포 센토 고스기유가 2024년 하라주쿠 도큐플라자 &quot;하라카도&quot; 지하 1층에 문을 연 2호점입니다. 번화가 한복판에서 전통 센토의 목욕 문화를 경험할 수 있습니다.</p>
