<h1>주조유</h1>
<p>기타 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 기타구 주조나카하라 1-14-21</p>
<p>기타에 자리한 전통 센토 &#x27;주조유&#x27;은(는) 1949년 창업한 센토로, 쇼와 레트로 감성의 찻집 &quot;깃사 신카이&quot;가 병설되어 있는 것이 특징입니다. 우물물을 사용한 질 좋은 목욕물과 시원한 냉수탕이 호평이며, 일요일에는 아침탕도 운영합니다.</p>
