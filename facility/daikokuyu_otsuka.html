<h1>다이코쿠유 (오쓰카)</h1>
<p>분쿄 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 분쿄구 오쓰카 3-8-6</p>
<p>분쿄에 자리한 전통 센토 &#x27;다이코쿠유 (오쓰카)&#x27;은(는) 분쿄구 오쓰카의 노포 센토로, 지역 이벤트와 기획 행사로도 알려져 있습니다. 스미다구의 동명 센토와는 다른 시설입니다.</p>
