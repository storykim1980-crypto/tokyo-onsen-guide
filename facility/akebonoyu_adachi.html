<h1>아케보노유 (아다치)</h1>
<p>아다치 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 아다치구 아다치 4-22-3</p>
<p>아다치에 자리한 전통 센토 &#x27;아케보노유 (아다치)&#x27;은(는) 우물물을 장작으로 데워 쓰는 레트로한 분위기의 센토입니다. 날마다 바뀌는 약탕과 노천탕이 호평이며, 냉수탕과 강력한 제트탕도 갖췄습니다. 다이토구 아사쿠사와 고토구의 동명 센토와는 다른 시설입니다.</p>
