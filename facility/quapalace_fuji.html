<h1>쿠아팔레스 후지</h1>
<p>도시마 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 도시마구 지하야 2-25-6</p>
<p>도시마에 자리한 전통 센토 &#x27;쿠아팔레스 후지&#x27;은(는) 가나메초역에서 도보 12분 거리의 맨션형 센토입니다. 지역 주민들이 편하게 찾는 도심형 목욕탕입니다.</p>
