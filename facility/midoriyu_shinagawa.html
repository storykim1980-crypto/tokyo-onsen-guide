<h1>미도리유 (니시오이)</h1>
<p>시나가와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 시나가와구 니시오이 1-7-26</p>
<p>시나가와에 자리한 전통 센토 &#x27;미도리유 (니시오이)&#x27;은(는) 니시오이역에서 도보 3분 거리의 동네 센토로 자정까지 영업합니다. 메구로구 미도리가오카의 동명 센토와는 다른 시설입니다.</p>
