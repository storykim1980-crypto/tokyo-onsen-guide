<h1>우다가와유</h1>
<p>세타가야 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 세타가야구 하네기 1-18-9</p>
<p>세타가야에 자리한 전통 센토 &#x27;우다가와유&#x27;은(는) 다이타바시역과 히가시마쓰바라역의 중간에 위치한 동네 센토입니다. 자연광이 드는 밝은 욕실과 잘 관리된 청결함이 특징입니다.</p>
