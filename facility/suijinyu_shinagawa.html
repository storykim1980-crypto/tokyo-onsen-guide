<h1>스이진유 (미나미오이)</h1>
<p>시나가와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 시나가와구 미나미오이 6-9-10</p>
<p>시나가와에 자리한 전통 센토 &#x27;스이진유 (미나미오이)&#x27;은(는) 미나미오이 지역의 동네 센토로, 오후 3시부터 10시까지 운영합니다. 아라카와구 미나미센주의 동명 센토와는 다른 시설입니다.</p>
