<p>도쿄도 이타바시구 나카이타바시 29-3</p>
<p>이타바시에 자리한 전통 센토 &#x27;이나가키요쿠센&#x27;은(는) 나카이타바시역 인근의 동네 센토입니다. 봄이면 벚꽃으로 유명한 이시가미이강 산책로가 가까워 꽃구경과 함께 들르기 좋습니다.</p>
