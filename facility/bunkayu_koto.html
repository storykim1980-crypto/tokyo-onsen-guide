<h1>분카유 (기타스나)</h1>
<p>고토 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 고토구 기타스나 6-14-8</p>
<p>고토에 자리한 전통 센토 &#x27;분카유 (기타스나)&#x27;은(는) 평일 오후 2시, 일요일과 공휴일은 오후 1시부터 문을 여는 동네 센토입니다. 이른 시간부터 이용할 수 있어 낮 목욕을 즐기는 이들에게 편리합니다.</p>
