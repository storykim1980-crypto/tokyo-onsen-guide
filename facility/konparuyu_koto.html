<h1>곤파루유 (고토)</h1>
<p>고토 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 고토구 도요 1-6-9</p>
<p>고토에 자리한 전통 센토 &#x27;곤파루유&#x27;은(는) 몸도 마음도 따뜻해지는 아늑한 분위기의 센토입니다. 기바역에서 도보 4분 거리로 접근성이 좋습니다. 주오구 긴자의 金春湯와는 다른 시설입니다.</p>
