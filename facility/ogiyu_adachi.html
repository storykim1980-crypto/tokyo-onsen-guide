<h1>오기유</h1>
<p>아다치 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 아다치구 오기 1-34-3</p>
<p>아다치에 자리한 전통 센토 &#x27;오기유&#x27;은(는) 지금도 장작으로 물을 데우는 옛 정취의 센토입니다. 페인트화가 있고 남탕에는 혈압계, 여탕에는 패치워크 작품이 전시되어 있는 점이 이곳만의 개성입니다. 최종 입장은 22시 30분입니다.</p>
