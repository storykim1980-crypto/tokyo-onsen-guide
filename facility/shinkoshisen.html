<h1>신코시센</h1>
<p>나카노 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 나카노구 아라이 5-17-2</p>
<p>나카노에 자리한 전통 센토 &#x27;신코시센&#x27;은(는) 아라이야쿠시마에역에서 도보 3분 거리의 동네 센토입니다. 인근의 아라이야쿠시(바이쇼인) 참배와 함께 들르기 좋습니다.</p>
