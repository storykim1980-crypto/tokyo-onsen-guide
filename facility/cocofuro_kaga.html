<h1>코코후로 가가요쿠조</h1>
<p>기타 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 기타구 호리후네 3-19-3</p>
<p>기타에 자리한 전통 센토 &#x27;코코후로 가가요쿠조&#x27;은(는) 2023년 5월 문을 연 디자이너스 센토입니다. 오쿠히다의 천연 유노하나를 사용한 &quot;하나노유&quot;, 생약을 쓴 &quot;이로도리노유&quot;, 깊이 90cm의 냉수탕 세 종류를 갖췄고, 사일런트 로우류 등 사우나 연출로도 알려져 있습니다.</p>
