<h1>다케노유 (모리시타)</h1>
<p>고토 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 고토구 모리시타 4-9-18</p>
<p>고토에 자리한 전통 센토 &#x27;다케노유 (모리시타)&#x27;은(는) 무료 주차장을 갖춘 동네 센토로 밤 11시까지 영업합니다. 커피의 거리로 알려진 기요스미시라카와에서도 걸어갈 수 있습니다.</p>
