<h1>쓰루노유 (후나보리)</h1>
<p>에도가와 · 천연 온천 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 에도가와구 후나보리 2-11-16</p>
<p>에도가와에 자리한 천연 온천 &#x27;쓰루노유 (후나보리)&#x27;은(는) 에도가와구청이 소개하는 천연 흑탕 온천 센토 중 한 곳으로, 원천을 그대로 흘려보내는 노천탕이 자랑입니다. 후나보리역 도보권이며 인근에 신카와 센본자쿠라 산책로가 있어 벚꽃철에 함께 즐기기 좋습니다.</p>
