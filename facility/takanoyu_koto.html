<p>도쿄도 고토구 가메이도 5-9-7</p>
<p>고토에 자리한 전통 센토 &#x27;다카노유&#x27;은(는) 가메이도역에서 도보 4분 거리의 동네 센토입니다. 등나무꽃으로 유명한 가메이도 덴진 신사 참배와 함께 들르기 좋습니다.</p>
