<p>시나가와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 시나가와구 후타바 2-4-4</p>
<p>시나가와에 자리한 전통 센토 &#x27;오모리유&#x27;은(는) 주택가에 자리한 아담한 센토입니다. 얕은 탕과 깊은 탕 두 종류에 각각 다른 제트 바스가 있고, 수온은 41도로 알맞게 설정되어 있습니다. 사우나를 추가 요금 없이 이용할 수 있는 점이 큰 장점입니다.</p>
