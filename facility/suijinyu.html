<h1>스이진유 (미나미센주)</h1>
<p>아라카와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 아라카와구 미나미센주 3-42-6</p>
<p>아라카와에 자리한 전통 센토 &#x27;스이진유&#x27;은(는) 1952년 창업한 노포 센토입니다. 피부에 닿는 감촉이 부드럽고 몸이 속부터 따뜻해진다는 평이 많으며, 넓은 욕조에서 여유롭게 몸을 펼 수 있습니다.</p>
