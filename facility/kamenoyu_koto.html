<p>고토 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 고토구 사루에 1-18-9</p>
<p>고토에 자리한 전통 센토 &#x27;가메노유 (사루에)&#x27;은(는) 옛 방식의 높은 천장과 넓은 씻는 자리에서 여유롭게 쉴 수 있는 센토입니다. 손질이 잘 된 정원에 사계절 풀꽃이 피어 정취를 더합니다. 자정까지 영업합니다.</p>
