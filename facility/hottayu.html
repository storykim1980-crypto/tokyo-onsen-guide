<h1>홋타유</h1>
<p>아다치 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 아다치구 세키바라 3-20-14</p>
<p>아다치에 자리한 전통 센토 &#x27;홋타유&#x27;은(는) 1942년 창업한 노포로 2022년 4월 전면 리뉴얼했습니다. 도쿄에서 가장 깊은 160cm 냉수탕과 약초 사우나, 넓은 노천탕을 갖춰 사우나 애호가들에게 높은 평가를 받고 있습니다. 리뉴얼 후에도 남겨진 우키요에 타일화가 상징입니다.</p>
