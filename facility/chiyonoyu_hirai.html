<h1>지요노유 (히라이)</h1>
<p>에도가와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 에도가와구 히라이 4-19-7</p>
<p>에도가와에 자리한 전통 센토 &#x27;지요노유 (히라이)&#x27;은(는) 히라이역에서 도보 7분 거리의 동네 센토로, 오후 2시부터 문을 엽니다. 메구로구의 동명 센토와는 다른 시설입니다.</p>
