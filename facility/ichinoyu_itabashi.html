<h1>이치노유 (이타바시)</h1>
<p>이타바시 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 이타바시구 사카에초 20-11</p>
<p>이타바시에 자리한 전통 센토 &#x27;이치노유 (이타바시)&#x27;은(는) 제트탕과 기포탕, 스탠딩 샤워를 갖춘 센토로 약탕이 인기입니다. 제트의 수압이 강하고 로비가 넓어 목욕 후 편히 쉴 수 있습니다. 나카노구 누마부쿠로의 동명 센토와는 다른 시설입니다.</p>
