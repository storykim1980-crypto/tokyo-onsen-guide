<h1>간다유</h1>
<p>아라카와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 아라카와구 니시오구 8-38-3</p>
<p>아라카와에 자리한 전통 센토 &#x27;간다유&#x27;은(는) 도덴 아라카와선 아라카와샤코마에역에서 도보 1분 거리의 센토입니다. 달마다 바뀌는 천연광석탕, 제트 좌욕, 자체 블렌드 약탕, 실키탕, 전자 마사지탕을 갖췄고 질 좋은 우물물을 사용합니다. 빈손으로 와도 되는 입욕 세트가 있고 짐 보관도 가능합니다.</p>
