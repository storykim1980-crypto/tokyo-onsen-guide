<h1>도쿄요쿠조</h1>
<p>시나가와 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 시나가와구 고야마 6-7-2</p>
<p>시나가와에 자리한 전통 센토 &#x27;도쿄요쿠조&#x27;은(는) 전통 미야즈쿠리 건축의 센토로 로비가 넓고 여유롭습니다. 잉어 연못이 있는 손질된 중정과 밤하늘을 바라보며 약탕을 즐길 수 있습니다. 아침 5시부터 8시까지, 그리고 오후 2시부터 새벽 2시까지 영업해 이용 시간대가 매우 넓습니다.</p>
