<h1>아쿠아가든 사카에유</h1>
<p>가쓰시카 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 가쓰시카구 히가시요쓰기 3-45-7</p>
<p>가쓰시카에 자리한 전통 센토 &#x27;아쿠아가든 사카에유&#x27;은(는) 요쓰기역 인근의 모던한 센토로, 아이도 안심하고 들어갈 수 있는 얕은 욕조와 미지근한 목욕물이 특징입니다. 주말과 공휴일에는 날마다 바뀌는 약탕 노천을 즐길 수 있고, 목욕 후 생맥주도 판매합니다.</p>
