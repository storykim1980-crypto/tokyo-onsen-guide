<h1>다이코쿠유 (나카메구로)</h1>
<p>메구로 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 메구로구 메구로 4-16-4</p>
<p>메구로에 자리한 전통 센토 &#x27;다이코쿠유 (나카메구로)&#x27;은(는) 창업 이래 이어져 온 옛 정취의 센토입니다. 처마 앞의 잘 손질된 소나무가 좋은 표식이 되며, 나카메구로에서 녹지 산책로를 따라 걸어갈 수 있습니다. 스미다구·분쿄구의 동명 센토와는 다른 시설입니다.</p>
