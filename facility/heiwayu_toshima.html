<h1>헤이와유 (이케부쿠로)</h1>
<p>도시마 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 도시마구 이케부쿠로 2-64-11</p>
<p>도시마에 자리한 전통 센토 &#x27;헤이와유 (이케부쿠로)&#x27;은(는) 이케부쿠로역 서쪽 헤이와도리 상점가 중간, 빌딩 지하에 자리한 드문 형태의 센토입니다. 번화가 한복판에서 심야 1시까지 영업해 늦은 시간에도 이용할 수 있습니다. 네리마구의 동명 센토와는 다른 시설입니다.</p>
