<h1>만넨유</h1>
<p>신주쿠 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 신주쿠구 오쿠보 1-15-17</p>
<p>신주쿠에 자리한 전통 센토 &#x27;만넨유&#x27;은(는) 신오쿠보 코리아타운의 골목 안쪽에 조용히 자리한 센토입니다. 2016년 나무를 풍부하게 쓴 일본식 디자인으로 전면 개장했고, 연수를 사용한 부드러운 목욕물이 특징입니다. 바디소프·샴푸·수건 대여가 무료라 빈손으로도 이용할 수 있어 여행자에게 인기입니다.</p>
