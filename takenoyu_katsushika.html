<h1>다케노유 (가쓰시카)</h1>
<p>가쓰시카 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 가쓰시카구 요쓰기</p>
<p>가쓰시카에 자리한 전통 센토 &#x27;다케노유 (가쓰시카)&#x27;은(는) 요쓰기역 도보 3분의 정취 있는 센토입니다. 남탕에 그려진 붉은 후지산 그림이 일반적인 센토 배경화와 달라 인상적이며, 탈의실에는 손잡이와 음용수가 마련되어 있습니다.</p>
