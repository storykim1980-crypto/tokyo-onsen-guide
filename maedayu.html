<h1>마에다유</h1>

<p>도쿄도 도시마구 이케부쿠로 4-22-8</p>
<p>도시마에 자리한 전통 센토 &#x27;마에다유&#x27;은(는) 입구에 꽃집을 병설한 전국에서도 드문 센토입니다. 지금도 장작으로 물을 데우며, 천장이 높고 넓은 욕실과 널찍한 씻는 자리가 특징입니다.</p>
