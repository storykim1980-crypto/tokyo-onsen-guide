<h1>지요노유</h1>
<p>메구로 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 메구로구 다카반 2-20-3</p>
<p>메구로에 자리한 전통 센토 &#x27;지요노유&#x27;은(는) 가쿠게이다이가쿠역에서 도보 2분 거리의 동네 센토입니다. 뜨거운 목욕물과 후지산 페인트화, 높은 천장에 울리는 나무 대야 소리 등 쇼와 시대의 정취를 간직하고 있습니다.</p>
