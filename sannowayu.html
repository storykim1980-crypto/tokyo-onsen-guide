<h1>산노와유</h1>
<p>신주쿠 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 신주쿠구 가미오치아이 3-31-2</p>
<p>신주쿠에 자리한 전통 센토 &#x27;산노와유&#x27;은(는) 오치아이 지역의 동네 센토입니다. 이 일대는 도보 10분권에 센토가 여섯 곳이나 모여 있는, 목욕 문화가 뿌리내린 동네입니다.</p>
