<h1>미도리유 (메구로)</h1>
<p>메구로 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 메구로구 미도리가오카 2-7-14</p>
<p>메구로에 자리한 전통 센토 &#x27;미도리유&#x27;은(는) 지유가오카의 번잡함을 벗어난 곳에 자리한 센토입니다. 흑백을 기조로 한 모던한 욕실과 박력 있는 후지산 그래픽이 맞이하며, 수건 대여가 있어 빈손으로도 들를 수 있습니다.</p>
