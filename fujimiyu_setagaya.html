<h1>후지미유 (산겐자야)</h1>
<p>세타가야 · 전통 센토 · 550엔~ (도쿄 공통요금)</p>
<p>도쿄도 세타가야구 다이시도 5-3-15</p>
<p>세타가야에 자리한 전통 센토 &#x27;후지미유 (산겐자야)&#x27;은(는) 산겐자야에서 차사와도리를 따라 북쪽으로 조금 올라간 빌딩 1층에 자리한 센토입니다. 산겐자야와 시모키타자와의 중간에 있어 양쪽에서 접근하기 좋습니다.</p>
